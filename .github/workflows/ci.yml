name: Pipeline CI Python

on:
  push:
    branches: [ "main", "master" ]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        # Entramos a la subcarpeta porque ahí guardaste el requirements.txt
        cd Proyecto_Python_Base_U5 
        pip install -r requirements.txt

    - name: Ejecutar Pruebas (Pytest)
      run: |
        # Entramos a la subcarpeta para correr pytest
        cd Proyecto_Python_Base_U5
        python -m pytest -v --cov=src --cov-fail-under=80
